services:
  - type: web
    name: docrequest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: docrequest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
databases:
  - name: docrequest-db
    plan: free
    databaseName: docrequest
    user: docrequest
